<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyboard sketch · Chord Trainer</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Keyboard component ─────────────────────────────── */
    .kbd {
      display: block;
      width: 100%;
      height: auto;
      max-width: 280px;
      margin: 0.75rem auto 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    }

    .kbd .key {
      stroke: #0d0d0f;
      stroke-width: 0.6;
    }

    .kbd .key.white { fill: #f0ede6; }
    .kbd .key.black { fill: #16161a; }

    .kbd .key.on            { fill: var(--accent); }
    .kbd .root-dot          { fill: #0d0d0f; }

    /* ── Preview layout (sandbox only) ───────────────────── */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .preview-card {
      text-align: center;
    }

    .preview-card .glyph {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 2.6rem;
      color: var(--accent);
      line-height: 1;
    }

    .preview-card .lbl {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    .reveal-chevron {
      margin-top: 0.6rem;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.7rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.15s, border-color 0.15s;
    }

    .reveal-chevron:hover {
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    .reveal-chevron.open {
      transform: rotate(180deg);
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    .kbd-wrap.hidden { display: none; }

    .note {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Keyboard <span>sketch</span></h1>
      <button id="btn-theme-toggle" class="theme-toggle" title="Toggle theme">🌙</button>
    </div>
    <p>Visual prototype · click to reveal</p>
  </header>

  <main class="app">
    <div class="card">
      <div class="section-label">Sample chords</div>
      <div class="preview-grid" id="grid"></div>
      <p class="note">All four states are toggleable. Root note is slightly brighter than the other chord tones.</p>
    </div>
  </main>

  <script>
    // ── Keyboard renderer ─────────────────────────────────────────
    // Single fixed-position keyboard, anchored at C. Chord tones are
    // collapsed mod 12 so every chord fits in one octave.
    //
    // semitones: array of ints 0..11 (chord tones)
    // root:      int 0..11        (which one to mark as root)
    function renderKeyboard(semitones, root) {
      const WHITE_W = 24, WHITE_H = 96;
      const BLACK_W = 14, BLACK_H = 60;
      const WHITE_SEMITONES = [0, 2, 4, 5, 7, 9, 11, 12]; // C D E F G A B C
      const BLACK_KEYS = [
        { semi: 1,  after: 0 },
        { semi: 3,  after: 1 },
        { semi: 6,  after: 3 },
        { semi: 8,  after: 4 },
        { semi: 10, after: 5 },
      ];
      const totalW = WHITE_SEMITONES.length * WHITE_W;

      const isOn   = s => semitones.includes(s % 12);
      const isRoot = s => (s % 12) === (root % 12);

      let svg = `<svg class="kbd" viewBox="0 0 ${totalW} ${WHITE_H}" preserveAspectRatio="xMidYMid meet">`;
      let dots = '';
      // White keys
      WHITE_SEMITONES.forEach((semi, i) => {
        const cls = ['key', 'white'];
        if (isOn(semi)) cls.push('on');
        svg += `<rect class="${cls.join(' ')}" x="${i * WHITE_W}" y="0" width="${WHITE_W}" height="${WHITE_H}"/>`;
        if (isOn(semi) && isRoot(semi)) {
          dots += `<circle class="root-dot" cx="${i * WHITE_W + WHITE_W / 2}" cy="${WHITE_H - 12}" r="3"/>`;
        }
      });
      // Black keys on top
      BLACK_KEYS.forEach(({ semi, after }) => {
        const cls = ['key', 'black'];
        if (isOn(semi)) cls.push('on');
        const x = (after + 1) * WHITE_W - BLACK_W / 2;
        svg += `<rect class="${cls.join(' ')}" x="${x}" y="0" width="${BLACK_W}" height="${BLACK_H}"/>`;
        if (isOn(semi) && isRoot(semi)) {
          dots += `<circle class="root-dot" cx="${x + BLACK_W / 2}" cy="${BLACK_H - 9}" r="2.5"/>`;
        }
      });
      svg += dots + '</svg>';
      return svg;
    }

    // ── Sample chords for the sketch ──────────────────────────────
    // intervals are semitones above the root
    const SAMPLES = [
      { display: 'C',     label: 'C major',          root: 0, intervals: [0, 4, 7] },
      { display: 'Cm',    label: 'C minor',          root: 0, intervals: [0, 3, 7] },
      { display: 'Cmaj7', label: 'C major 7',        root: 0, intervals: [0, 4, 7, 11] },
      { display: 'F♯m',   label: 'F-sharp minor',    root: 6, intervals: [0, 3, 7] },
      { display: 'G7',    label: 'G dominant 7',     root: 7, intervals: [0, 4, 7, 10] },
      { display: 'C13',   label: 'C dominant 13',    root: 0, intervals: [0, 4, 7, 10, 2, 5, 9] },
    ];

    // ── Build the grid ────────────────────────────────────────────
    const grid = document.getElementById('grid');
    SAMPLES.forEach((c, idx) => {
      const tones = c.intervals.map(iv => (c.root + iv) % 12);
      const startHidden = idx > 1; // first two visible, others hidden — to show both states

      const card = document.createElement('div');
      card.className = 'preview-card';
      card.innerHTML = `
        <div class="glyph">${c.display}</div>
        <div class="lbl">${c.label}</div>
        <button class="reveal-chevron ${startHidden ? '' : 'open'}" aria-label="Toggle keyboard">▾</button>
        <div class="kbd-wrap ${startHidden ? 'hidden' : ''}">
          ${renderKeyboard(tones, c.root)}
        </div>
      `;
      const btn = card.querySelector('.reveal-chevron');
      const wrap = card.querySelector('.kbd-wrap');
      btn.addEventListener('click', () => {
        const nowHidden = wrap.classList.toggle('hidden');
        btn.classList.toggle('open', !nowHidden);
      });
      grid.appendChild(card);
    });

    // ── Theme toggle (same pattern as the app) ────────────────────
    const themeBtn = document.getElementById('btn-theme-toggle');
    const theme = localStorage.getItem('chord-trainer-theme') || 'dark';
    document.body.classList.toggle('light', theme === 'light');
    themeBtn.textContent = theme === 'light' ? '☀' : '🌙';
    themeBtn.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light');
      localStorage.setItem('chord-trainer-theme', isLight ? 'light' : 'dark');
      themeBtn.textContent = isLight ? '☀' : '🌙';
    });
  </script>
</body>
</html>
